<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pavan | AI Engineer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  font-family: 'Orbitron', sans-serif;
  background: black;
  color: white;
  overflow-x: hidden;
}

/* 🌌 Animated Background */
.bg {
  position: fixed;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at 20% 20%, #0ea5e9, transparent),
              radial-gradient(circle at 80% 80%, #9333ea, transparent),
              black;
  animation: moveBg 10s infinite alternate;
  z-index: -1;
}

@keyframes moveBg {
  0% { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(60deg); }
}

/* Layout spacing */
.section {
  padding: 100px 10%;
}

/* Hero */
.hero {
  text-align: center;
  padding-top: 120px;
}

.hero h1 {
  font-size: 60px;
  background: linear-gradient(90deg, cyan, violet);
  -webkit-background-clip: text;
  color: transparent;
}

.hero p {
  color: #aaa;
  font-size: 20px;
}

/* Glass Cards */
.projects {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 30px;
}

.card {
  padding: 25px;
  border-radius: 20px;
  backdrop-filter: blur(20px);
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.05);
  border: 1px solid cyan;
}

.btn {
  display: inline-block;
  margin-top: 10px;
  padding: 10px 20px;
  background: linear-gradient(90deg, cyan, violet);
  border-radius: 10px;
  text-decoration: none;
  color: black;
  font-weight: bold;
}

h2 {
  margin-bottom: 40px;
  font-size: 30px;
  color: cyan;
}

footer {
  text-align: center;
  padding: 40px;
  color: #666;
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="hero">
  <h1>Pavan</h1>
  <p>AI Engineer | GenAI | Building the Future</p>
</div>

<div class="section">
  <h2>🚀 Projects</h2>
  <div class="projects" id="projects"></div>
</div>

<div class="section">
  <h2>🧠 Skills</h2>
  <p>Python • AI • ML • GenAI • D365 • SQL</p>
</div>

<div class="section">
  <h2>📬 Contact</h2>
  <p>Email: pavanachar325@gmail.com</p>
  <a href="https://github.com/DEADPOOL0610" class="btn">GitHub</a>
</div>

<footer>
  © 2026 Pavan
</footer>

<script>
const projects = [
  {
    title: "AI Chatbot",
    desc: "Conversational AI",
    link: "https://github.com/yourusername/project1"
  },
  {
    title: "ERP System",
    desc: "AI-powered ERP",
    link: "https://github.com/yourusername/project2"
  }
];

const container = document.getElementById("projects");

projects.forEach(p => {
  container.innerHTML += `
    <div class="card">
      <h3>${p.title}</h3>
      <p>${p.desc}</p>
      <a href="${p.link}" target="_blank" class="btn">View</a>
    </div>
  `;
});
</script>

</body>
</html>
